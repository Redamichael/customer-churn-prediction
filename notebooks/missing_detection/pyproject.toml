[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "missing-detection"
version = "0.1.0"
description = "A custom library for detecting missing values in pandas DataFrames with flexible patterns"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
dependencies = [
    "pandas",
    "numpy",
]
requires-python = ">=3.6"
readme = "README.md"
license = {text = "MIT"}

[project.urls]
Homepage = "https://github.com/yourusername/missing-detection"
Repository = "https://github.com/yourusername/missing-detection.git"

[tool.setuptools]
packages = ["missing_detection"]